global-styling:
  css:
    theme:
      'https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&family=Roboto:wght@400;500;700&display=swap': { type: external }
      libraries/slinky/dist/slinky.min.css: {}
      dist/css/style.css: {}
  js:
    libraries/slinky/dist/slinky.min.js: { }
    js/collapse.js: {}
  dependencies:
    - core/drupal
    - core/drupalSettings
    - core/jquery.once
    - core/jquery

alert-styling:
  js:
    js/dismiss-message.js: { }

flexslider:
  css:
    theme:
      libraries/flexslider/flexslider.css: {}
  js:
    libraries/flexslider/demo/js/jquery.mousewheel.js: {}
    libraries/flexslider/jquery.flexslider.js: {}
  dependencies:
    - core/drupal
    - core/drupalSettings
    - core/jquery.once
    - core/jquery

flexslider-slider-single:
  js:
    js/slider.js: { }
  dependencies:
    - drupaldev_theme/flexslider

owl-carousel:
  css:
    theme:
      libraries/owl-carousel/dist/assets/owl.carousel.css: {}
      libraries/owl-carousel/dist/assets/owl.theme.default.css: {}
  js:
    libraries/owl-carousel/dist/owl.carousel.js: {}
  dependencies:
    - core/drupal
    - core/drupalSettings
    - core/jquery.once
    - core/jquery

owlcarousel-slider-single:
  js:
    js/carousel-oneitem.js: { }
  dependencies:
    - drupaldev_theme/owl-carousel

owlcarousel-product:
  js:
    js/carousel-products.js: { }
  dependencies:
    - drupaldev_theme/owl-carousel

owlcarousel-googlereviews:
  js:
    js/carousel-googlereviews.js: { }
  dependencies:
    - drupaldev_theme/owl-carousel

product-full:
  dependencies:
    - drupaldev_theme/owlcarousel-product

number-input:
  js:
    js/numberinput.js: {}
  dependencies:
    - core/drupal
    - core/drupalSettings
    - core/jquery.once
    - core/jquery

data-tables:
  remote: https://datatables.net
  version: 1.4.4
  license:
    name: MIT
    url: https://github.com/DataTables/DataTables/blob/master/license.txt
    gpl-compatible: true
  css:
    theme:
      "https://nightly.datatables.net/css/jquery.dataTables.min.css": { type: external, minified: true }
      "https://nightly.datatables.net/responsive/css/responsive.dataTables.min.css": { type: external, minified: true }
  js:
    "https://nightly.datatables.net/js/jquery.dataTables.min.js": { type: external, minified: true }
    "https://nightly.datatables.net/buttons/js/buttons.colVis.min.js": { type: external, minified: true }
    "https://nightly.datatables.net/responsive/js/dataTables.responsive.min.js": { type: external, minified: true }

cart-data-table:
  js:
    js/cart-table.js: { }
  dependencies:
    - drupaldev_theme/data-tables
    - core/drupal
    - core/drupalSettings
    - core/jquery.once
    - core/jquery
