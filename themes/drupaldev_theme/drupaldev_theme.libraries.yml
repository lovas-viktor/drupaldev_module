global-styling:
  css:
    theme:
      libraries/slinky/dist/slinky.min.css: {}
      dist/css/style.css: {}
  js:
    libraries/slinky/dist/slinky.min.js: { }
    js/collapse.js: {}
  dependencies:
    - core/drupal
    - core/drupalSettings
    - core/jquery.once
    - core/jquery

alert-styling:
  js:
    js/dismiss-message.js: { }

flexslider:
  css:
    theme:
      libraries/flexslider/flexslider.css: {}
  js:
    libraries/flexslider/jquery.flexslider.js: {}
    libraries/flexslider/demo/js/jquery.mousewheel.js: {}
    js/slider.js: {}
  dependencies:
    - core/drupal
    - core/drupalSettings
    - core/jquery.once
    - core/jquery

flexslider-slider-single:
  js:
    js/slider.js: { }
  dependencies:
    - drupaldev/flexslider

number-input:
  js:
    js/numberinput.js: {}
  dependencies:
    - core/drupal
    - core/drupalSettings
    - core/jquery.once
    - core/jquery

data-tables:
  remote: https://datatables.net
  version: 1.4.4
  license:
    name: MIT
    url: https://github.com/DataTables/DataTables/blob/master/license.txt
    gpl-compatible: true
  css:
    theme:
      "https://nightly.datatables.net/css/jquery.dataTables.min.css": { type: external, minified: true }
      "https://nightly.datatables.net/responsive/css/responsive.dataTables.min.css": { type: external, minified: true }
  js:
    "https://nightly.datatables.net/js/jquery.dataTables.min.js": { type: external, minified: true }
    "https://nightly.datatables.net/buttons/js/buttons.colVis.min.js": { type: external, minified: true }
    "https://nightly.datatables.net/responsive/js/dataTables.responsive.min.js": { type: external, minified: true }

cart-data-table:
  js:
    js/cart-table.js: { }
  dependencies:
    - drupaldev_theme/data-tables
    - core/drupal
    - core/drupalSettings
    - core/jquery.once
    - core/jquery
