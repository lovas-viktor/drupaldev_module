services:
  drupaldev_commerce.profile_field_copy:
    class: Drupal\drupaldev_commerce\ProfileFieldCopy
    parent: commerce_shipping.profile_field_copy
  drupaldev_commerce.breadcrumbs:
    class: Drupal\drupaldev_commerce\CustomBreadcrumbs
    tags:
      - { name: breadcrumb_builder, priority: 100 }
  drupaldev_commerce.event_subscriber:
    class: Drupal\drupaldev_commerce\EventSubscriber\ProductDefaultVariation
    tags:
      - { name: event_subscriber }
  drupaldev_commerce.order_paid_subscriber:
    class: Drupal\drupaldev_commerce\EventSubscriber\OrderPaidSubscriber
    tags:
      - { name: event_subscriber }
