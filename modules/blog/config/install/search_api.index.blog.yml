langcode: en
status: true
dependencies:
  config:
    - search_api.server.solr
    - core.entity_view_mode.node.list
  module:
    - search_api_solr
    - search_api
    - node
  enforced:
    module:
      - drupaldev_blog
third_party_settings:
  search_api_solr:
    finalize: false
    commit_before_finalize: false
    commit_after_finalize: false
    debug_finalize: false
    highlighter:
      maxAnalyzedChars: 51200
      fragmenter: gap
      usePhraseHighlighter: true
      highlightMultiTerm: true
      preserveMulti: false
      regex:
        slop: 0.5
        pattern: blank
        maxAnalyzedChars: 10000
      highlight:
        mergeContiguous: false
        requireFieldMatch: false
        snippets: 3
        fragsize: 0
    mlt:
      mintf: 1
      mindf: 1
      maxdf: 0
      maxdfpct: 0
      minwl: 0
      maxwl: 0
      maxqt: 100
      maxntp: 2000
      boost: false
      interestingTerms: none
    term_modifiers:
      slop: 3
      fuzzy: 1
      fuzzy_analyzer: true
    advanced:
      index_prefix: ''
      collection: ''
      timezone: ''
    multilingual:
      limit_to_content_language: false
      include_language_independent: true
      use_language_undefined_as_fallback_language: false
      specific_languages:
        en: '0'
        hu: '0'
        de: '0'
      use_universal_collation: false
id: blog
name: Blog
description: ''
read_only: false
field_settings:
  field_category:
    label: Category
    datasource_id: 'entity:node'
    property_path: field_category
    type: integer
    dependencies:
      config:
        - field.storage.node.field_category
  body:
    label: Törzs
    datasource_id: 'entity:node'
    property_path: body
    type: text
    dependencies:
      module:
        - drupaldev_blog
  rendered_item:
    label: 'Rendered HTML output'
    property_path: rendered_item
    type: solr_string_storage
    configuration:
      roles:
        - anonymous
      view_mode:
        'entity:node':
          drupaldev_blog: list
  title:
    label: Cím
    datasource_id: 'entity:node'
    property_path: title
    type: text
    boost: 5.0
    dependencies:
      module:
        - drupaldev_blog
datasource_settings:
  'entity:node':
    bundles:
      default: false
      selected:
        - drupaldev_blog
    languages:
      default: true
      selected: { }
processor_settings:
  add_url: { }
  aggregated_field: { }
  auto_aggregated_fulltext_field: { }
  custom_value: { }
  entity_type: { }
  language_with_fallback: { }
  rendered_item: { }
  solr_date_range: { }
tracker_settings:
  default:
    indexing_order: fifo
options:
  cron_limit: 50
  index_directly: true
  track_changes_in_references: true
server: solr
