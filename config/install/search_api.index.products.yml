langcode: en
status: true
dependencies:
  config:
    - field.storage.commerce_product.body
    - field.storage.commerce_product.field_catalog
    - field.storage.commerce_product.field_related_products
    - search_api.server.solr
    - core.entity_view_mode.commerce_product.catalog
  module:
    - search_api_solr
    - commerce_product
    - search_api
    - drupaldev_search
third_party_settings:
  search_api_solr:
    finalize: false
    commit_before_finalize: false
    commit_after_finalize: false
    debug_finalize: false
    highlighter:
      maxAnalyzedChars: 51200
      fragmenter: gap
      usePhraseHighlighter: true
      highlightMultiTerm: true
      preserveMulti: false
      regex:
        slop: 0.5
        pattern: blank
        maxAnalyzedChars: 10000
      highlight:
        mergeContiguous: false
        requireFieldMatch: false
        snippets: 3
        fragsize: 0
    mlt:
      mintf: 1
      mindf: 1
      maxdf: 0
      maxdfpct: 0
      minwl: 0
      maxwl: 0
      maxqt: 100
      maxntp: 2000
      boost: false
      interestingTerms: none
    term_modifiers:
      slop: 3
      fuzzy: 1
    advanced:
      index_prefix: ''
      collection: ''
      timezone: ''
    multilingual:
      limit_to_content_language: false
      include_language_independent: false
      use_language_undefined_as_fallback_language: false
      specific_languages:
        en: en
        hu: hu
      use_universal_collation: false
id: products
name: Products
description: ''
read_only: false
field_settings:
  body:
    label: Body
    datasource_id: 'entity:commerce_product'
    property_path: body
    type: text
    dependencies:
      config:
        - field.storage.commerce_product.body
  field_catalog:
    label: Catalog
    datasource_id: 'entity:commerce_product'
    property_path: field_catalog
    type: integer
    dependencies:
      config:
        - field.storage.commerce_product.field_catalog
  field_related_products:
    label: 'Related products'
    datasource_id: 'entity:commerce_product'
    property_path: field_related_products
    type: integer
    dependencies:
      config:
        - field.storage.commerce_product.field_related_products
  product_id:
    label: ID
    datasource_id: 'entity:commerce_product'
    property_path: product_id
    type: integer
    dependencies:
      module:
        - commerce_product
  related_products:
    label: 'Rendered HTML Related products'
    property_path: related_products
    type: solr_string_storage
    configuration:
      roles:
        anonymous: anonymous
      view_mode:
        'entity:commerce_product':
          default: catalog
      item_number: '12'
  rendered_item:
    label: 'Rendered HTML output'
    property_path: rendered_item
    type: solr_string_storage
    configuration:
      roles:
        - anonymous
      view_mode:
        'entity:commerce_product':
          default: catalog
  title:
    label: Title
    datasource_id: 'entity:commerce_product'
    property_path: title
    type: 'solr_text_custom_omit_norms:ngram'
    boost: !!float 2
    dependencies:
      module:
        - commerce_product
datasource_settings:
  'entity:commerce_product':
    bundles:
      default: true
      selected: {  }
    languages:
      default: true
      selected: {  }
processor_settings:
  add_url: {  }
  aggregated_field: {  }
  auto_aggregated_fulltext_field: {  }
  entity_type: {  }
  language_with_fallback: {  }
  related_products:
    weights:
      preprocess_index: -20
      preprocess_query: -20
    all_fields: 1
    fields:
      - body
      - rendered_item
      - title
  rendered_item: {  }
  reverse_entity_references: {  }
  solr_date_range:
    weights:
      preprocess_index: 0
tracker_settings:
  default:
    indexing_order: fifo
options:
  cron_limit: 50
  index_directly: true
  track_changes_in_references: true
server: solr
