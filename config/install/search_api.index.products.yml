langcode: en
status: true
dependencies:
  config:
    - field.storage.commerce_product.body
    - field.storage.commerce_product_variation.attribute_color
    - field.storage.commerce_product.field_catalog
    - field.storage.commerce_product.field_related_products
    - field.storage.commerce_product_variation.attribute_size
    - search_api.server.solr
    - core.entity_view_mode.commerce_product_variation.catalog
  module:
    - search_api_solr
    - commerce_product
    - search_api
    - drupaldev_search
third_party_settings:
  search_api_solr:
    finalize: false
    commit_before_finalize: false
    commit_after_finalize: false
    debug_finalize: false
    highlighter:
      maxAnalyzedChars: 51200
      fragmenter: gap
      usePhraseHighlighter: true
      highlightMultiTerm: true
      preserveMulti: false
      regex:
        slop: 0.5
        pattern: blank
        maxAnalyzedChars: 10000
      highlight:
        mergeContiguous: false
        requireFieldMatch: false
        snippets: 3
        fragsize: 0
    mlt:
      mintf: 1
      mindf: 1
      maxdf: 0
      maxdfpct: 0
      minwl: 0
      maxwl: 0
      maxqt: 100
      maxntp: 2000
      boost: false
      interestingTerms: none
    term_modifiers:
      slop: 3
      fuzzy: 1
    advanced:
      index_prefix: ''
      collection: ''
      timezone: ''
    multilingual:
      limit_to_content_language: false
      include_language_independent: false
      use_language_undefined_as_fallback_language: false
      specific_languages:
        en: en
        hu: hu
        de: '0'
      use_universal_collation: false
id: products
name: Products
description: ''
read_only: false
field_settings:
  body:
    label: 'Termék » Termék » Törzs'
    datasource_id: 'entity:commerce_product_variation'
    property_path: 'product_id:entity:body'
    type: text
    dependencies:
      config:
        - field.storage.commerce_product.body
      module:
        - commerce_product
  color:
    label: 'Szín » Product attribute value » Név'
    datasource_id: 'entity:commerce_product_variation'
    property_path: 'attribute_color:entity:name'
    type: string
    dependencies:
      config:
        - field.storage.commerce_product_variation.attribute_color
      module:
        - commerce_product
  field_catalog:
    label: 'Termék » Termék » Termékkategória'
    datasource_id: 'entity:commerce_product_variation'
    property_path: 'product_id:entity:field_catalog'
    type: integer
    dependencies:
      config:
        - field.storage.commerce_product.field_catalog
      module:
        - commerce_product
  field_related_products:
    label: 'Termék » Termék » Ajánlott termékek'
    datasource_id: 'entity:commerce_product_variation'
    property_path: 'product_id:entity:field_related_products'
    type: integer
    dependencies:
      config:
        - field.storage.commerce_product.field_related_products
      module:
        - commerce_product
  product_id:
    label: 'Termék » Termék » Azonosító'
    datasource_id: 'entity:commerce_product_variation'
    property_path: 'product_id:entity:product_id'
    type: integer
    dependencies:
      module:
        - commerce_product
  related_products:
    label: 'Related products'
    property_path: related_products
    type: solr_string_storage
    configuration:
      roles:
        anonymous: anonymous
      view_mode:
        'entity:commerce_product_variation':
          default: catalog
      item_number: '4'
  rendered_item:
    label: 'Rendered HTML output'
    property_path: rendered_item
    type: solr_string_storage
    configuration:
      roles:
        - anonymous
      view_mode:
        'entity:commerce_product_variation':
          default: catalog
  role_access:
    label: 'Role-based access information'
    property_path: search_api_role_access
    type: string
    indexed_locked: true
    type_locked: true
    hidden: true
  size:
    label: 'Méret » Product attribute value » Név'
    datasource_id: 'entity:commerce_product_variation'
    property_path: 'attribute_size:entity:name'
    type: string
    dependencies:
      config:
        - field.storage.commerce_product_variation.attribute_size
      module:
        - commerce_product
  title:
    label: 'Termék » Termék » Cím'
    datasource_id: 'entity:commerce_product_variation'
    property_path: 'product_id:entity:title'
    type: 'solr_text_custom_omit_norms:ngram'
    boost: !!float 2
    dependencies:
      module:
        - commerce_product
datasource_settings:
  'entity:commerce_product_variation':
    bundles:
      default: true
      selected: {  }
    languages:
      default: true
      selected: {  }
processor_settings:
  add_url: {  }
  aggregated_field: {  }
  auto_aggregated_fulltext_field: {  }
  custom_value: {  }
  entity_type: {  }
  hierarchy:
    weights:
      preprocess_index: -45
    fields:
      field_catalog: taxonomy_term-parent
  language_with_fallback: {  }
  related_products:
    weights:
      preprocess_index: -20
      preprocess_query: -20
    all_fields: 1
    fields:
      - body
      - rendered_item
      - title
  rendered_item: {  }
  reverse_entity_references: {  }
  role_access:
    weights:
      preprocess_query: -30
  solr_date_range:
    weights:
      preprocess_index: 0
tracker_settings:
  default:
    indexing_order: fifo
options:
  cron_limit: 50
  index_directly: true
  track_changes_in_references: true
server: solr
