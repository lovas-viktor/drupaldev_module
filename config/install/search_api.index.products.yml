langcode: en
status: true
dependencies:
  config:
    - field.storage.commerce_product.body
    - field.storage.commerce_product.field_brand
    - field.storage.commerce_product.field_product_categories
    - search_api.server.solr
    - core.entity_view_mode.commerce_product.catalog
  module:
    - search_api_solr
    - commerce_product
    - search_api
third_party_settings:
  search_api_solr:
    finalize: false
    commit_before_finalize: false
    commit_after_finalize: false
    debug_finalize: false
    highlighter:
      maxAnalyzedChars: 51200
      fragmenter: gap
      usePhraseHighlighter: true
      highlightMultiTerm: true
      preserveMulti: false
      regex:
        slop: 0.5
        pattern: blank
        maxAnalyzedChars: 10000
      highlight:
        mergeContiguous: false
        requireFieldMatch: false
        snippets: 3
        fragsize: 0
    mlt:
      mintf: 1
      mindf: 1
      maxdf: 0
      maxdfpct: 0
      minwl: 0
      maxwl: 0
      maxqt: 100
      maxntp: 2000
      boost: false
      interestingTerms: none
    term_modifiers:
      slop: 3
      fuzzy: 1
    advanced:
      index_prefix: ''
      collection: ''
      timezone: ''
    multilingual:
      limit_to_content_language: false
      include_language_independent: true
      use_language_undefined_as_fallback_language: false
      specific_languages:
        en: '0'
      use_universal_collation: false
id: products
name: Products
description: ''
read_only: false
field_settings:
  body:
    label: Body
    datasource_id: 'entity:commerce_product'
    property_path: body
    type: text
    dependencies:
      config:
        - field.storage.commerce_product.body
  field_brand:
    label: Brand
    datasource_id: 'entity:commerce_product'
    property_path: field_brand
    type: integer
    dependencies:
      config:
        - field.storage.commerce_product.field_brand
  field_product_categories:
    label: Categories
    datasource_id: 'entity:commerce_product'
    property_path: field_product_categories
    type: integer
    dependencies:
      config:
        - field.storage.commerce_product.field_product_categories
  rendered_item:
    label: 'Rendered HTML output'
    property_path: rendered_item
    type: solr_string_storage
    configuration:
      roles:
        - anonymous
      view_mode:
        'entity:commerce_product':
          default: catalog
          simple: catalog
  title:
    label: Title
    datasource_id: 'entity:commerce_product'
    property_path: title
    type: text
    boost: !!float 2
    dependencies:
      module:
        - commerce_product
datasource_settings:
  'entity:commerce_product':
    bundles:
      default: true
      selected: {  }
    languages:
      default: true
      selected: {  }
processor_settings:
  add_url: {  }
  aggregated_field: {  }
  auto_aggregated_fulltext_field: {  }
  entity_type: {  }
  language_with_fallback: {  }
  rendered_item: {  }
  reverse_entity_references: {  }
  solr_date_range:
    weights:
      preprocess_index: 0
tracker_settings:
  default:
    indexing_order: fifo
options:
  cron_limit: 50
  index_directly: true
  track_changes_in_references: true
server: solr
