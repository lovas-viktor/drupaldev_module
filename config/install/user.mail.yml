langcode: en
cancel_confirm:
  subject: 'Account cancellation request for [user:display-name] at [site:name]'
  body: "[user:display-name]\r\n\r\nA request to cancel your account has been made at [site:name].\r\n\r\nYou may now cancel your account on [site:url-brief] by clicking this link or copying and pasting it into your browser:\r\n\r\n[user:cancel-url]\r\n\r\nNOTE: The cancellation of your account is not reversible.\r\n\r\nThis link expires in one day and nothing will happen if it is not used.\r\n\r\n--  [site:name] team"
password_reset:
  subject: 'Password recovery | [site:name]'
  body: "<b>To set a new password for the <u>[user:mail]</u>, click here:</b>\r\n\r\n[user:one-time-login-url]\r\n\r\nThis link can only be used once.\r\n\r\nSincerely, the [site:name] team"
register_admin_created:
  subject: 'Successful registration by Administrator | [site:name]'
  body: "<b>You have been successfully registered with [user:mail] by the [site:name] site administrator!</b>\r\n\r\nTo login and set a the password, click here:\r\n\r\n[user:one-time-login-url]\r\n\r\nThis link can only be used once.\r\n\r\nSincerely, the [site:name] team"
register_no_approval_required:
  subject: 'Successful registration | [site:name]'
  body: "<b>You have successfully registered on the [site:name] site!</b>\r\n\r\nLater, you can enter the page with [user:mail] and your password.\r\nIf you have any questions, contact our customer service at [site:mail].\r\n\r\nSincerely, the [site:name] team"
register_pending_approval:
  subject: 'Successful registration (pending admin approval) | [site:name]'
  body: "<b>Thank you for registering at [site:name].</b>\r\n\r\nYour application for an account is currently pending approval. Once it has been approved, you will receive another email containing information about how to log in, set your password, and other details.\r\n\r\nSincerely, the [site:name] team"
register_pending_approval_admin:
  subject: 'New registration is pending approval by admin | [site:name]'
  body: "The new user is registered with [user:mail], you can approve him / her by clicking here:\r\n\r\n[user:edit-url]"
status_activated:
  subject: 'Your registration has been approved by the administrator | [site:name]'
  body: "<b>Your registration has been approved.</b>\r\n\r\nTo set a new password, click here:\r\n\r\n[user:one-time-login-url]\r\n\r\nThis link can only be used once.\r\n\r\nIn the future, you will be able to log in with the [user:mail] and the password you just set.\r\n\r\nSincerely, the [site:name] team"
status_blocked:
  subject: 'Account details for [user:display-name] at [site:name] (blocked)'
  body: "[user:display-name],\r\n\r\nYour account on [site:name] has been blocked.\r\n\r\n--  [site:name] team"
status_canceled:
  subject: 'Account details for [user:display-name] at [site:name] (canceled)'
  body: "[user:display-name],\r\n\r\nYour account on [site:name] has been canceled.\r\n\r\n--  [site:name] team"
