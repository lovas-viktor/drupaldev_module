langcode: en
status: true
dependencies:
  module:
    - commerce_checkout_order_fields
    - commerce_payment
    - commerce_promotion
    - commerce_shipping
    - drupaldev_commerce
    - email_registration
label: 'Drupaldev Checkout Flow'
id: drupaldev_checkout_flow
plugin: custom_checkout_flow
configuration:
  display_checkout_progress: true
  display_checkout_progress_breadcrumb_links: true
  guest_order_assign: false
  guest_new_account: false
  guest_new_account_notify: true
  panes:
    email_registration_login:
      allow_guest_checkout: true
      allow_registration: true
      registration_form_mode: register
      step: login
      weight: '0'
    contact_information:
      double_entry: true
      step: payment_information
      weight: '1'
    billing_profile:
      step: payment_information
      weight: '2'
    shipping_information:
      auto_recalculate: false
      require_shipping_profile: false
      step: shipping_information
      weight: '3'
    'order_fields:checkout':
      wrapper_element: fieldset
      display_label: Message
      step: shipping_information
      weight: '4'
    payment_method_select:
      step: payment_method
      weight: '5'
    review:
      step: review
      weight: '6'
    payment_process_drupaldev:
      capture: true
      step: payment
      weight: '7'
    completion_message:
      message:
        value: "Your order number is [commerce_order:order_number].\r\nYou can view your order on your account page when logged in."
        format: plain_text
      step: complete
      weight: '8'
    email_registration_completion_registration:
      step: complete
      weight: '9'
    order_summary:
      view: ''
      step: _sidebar
      weight: '10'
    coupon_redemption:
      allow_multiple: false
      step: _sidebar
      weight: '11'
    payment_process:
      capture: true
      step: _disabled
      weight: '12'
    payment_information:
      step: _disabled
      weight: '13'
    register:
      step: _disabled
      weight: '14'
    completion_register:
      step: _disabled
      weight: '15'
    login:
      allow_guest_checkout: true
      allow_registration: false
      registration_form_mode: register
      step: _disabled
      weight: '16'
