langcode: en
status: true
dependencies:
  module:
    - commerce_payment
    - commerce_shipping
    - drupaldev_commerce
label: 'Drupaldev Checkout Flow'
id: drupaldev_checkout_flow
plugin: custom_checkout_flow
configuration:
  display_checkout_progress: true
  display_checkout_progress_breadcrumb_links: false
  guest_order_assign: false
  guest_new_account: true
  guest_new_account_notify: true
  panes:
    login:
      allow_guest_checkout: true
      allow_registration: false
      registration_form_mode: register
      step: login
      weight: '0'
    billing_profile:
      step: payment_information
      weight: '1'
    shipping_information:
      auto_recalculate: true
      require_shipping_profile: true
      step: shipping_information
      weight: '2'
    payment_method_select:
      step: payment_method
      weight: '3'
    review:
      step: review
      weight: '4'
    payment_process:
      capture: true
      step: payment
      weight: '5'
    completion_register:
      step: complete
      weight: '6'
    completion_message:
      message:
        value: "Your order number is [commerce_order:order_number].\r\nYou can view your order on your account page when logged in."
        format: plain_text
      step: complete
      weight: '7'
    order_summary:
      view: ''
      step: _sidebar
      weight: '8'
    contact_information:
      double_entry: false
      step: _disabled
      weight: '9'
    payment_information:
      step: _disabled
      weight: '10'
