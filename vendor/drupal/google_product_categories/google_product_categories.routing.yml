google_product_categories.settings:
  path: '/admin/config/google-product-categories'
  defaults:
    _form: '\Drupal\google_product_categories\Form\ImportForm'
    _title: 'Google Product Categories Import'
  requirements:
    _permission: 'access administration pages'
  options:
    _admin_route: TRUE

google_product_categories.delete:
  path: '/admin/config/google-product-categories-delete'
  defaults:
    _form: '\Drupal\google_product_categories\Form\DeleteForm'
    _title: 'Delete existing Google Product Categories terms'
  requirements:
    _permission: 'access administration pages'